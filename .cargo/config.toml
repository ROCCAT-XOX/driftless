# The C runtime is linked into the Windows programs (static CRT), so that they start on PCs
# without the Visual C++ Redistributable (VCRUNTIME140.dll and VCRUNTIME140_1.dll are not part
# of Windows). packaging/windows/check-setup.ps1 fails if an installed program still imports it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
