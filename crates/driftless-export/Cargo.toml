[package]
name = "driftless-export"
description = "Driftless: Punktwolken, Oberflächen und Laufbahnen in offenen Formaten schreiben und lesen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Exposes `testutil` (synthetic clouds) to other crates' tests.
test-util = []

[dependencies]
driftless-io = { path = "../driftless-io" }
driftless-traj = { path = "../driftless-traj" }
e57 = "0.11"
gltf = { version = "1.4.1", default-features = false, features = ["KHR_materials_unlit", "utils"] }
gltf-json = { version = "1.4.1", features = ["KHR_materials_unlit"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
las = { version = "0.11", features = ["laz"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
# Self dev-dependency: enables `test-util` for the integration tests in tests/.
driftless-export = { path = ".", features = ["test-util"] }
