[package]
name = "driftless-cli"
description = "Driftless: Kommandozeile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "driftless"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
driftless-io = { path = "../driftless-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
driftless-io = { path = "../driftless-io", features = ["test-util"] }
predicates = "3"
