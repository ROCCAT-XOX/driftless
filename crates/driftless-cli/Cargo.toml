[package]
name = "driftless-cli"
description = "Driftless: Kommandozeile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "driftless"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
driftless-io = { path = "../driftless-io" }
driftless-traj = { path = "../driftless-traj" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rerun = { version = "0.38.1", default-features = false, features = ["sdk", "rrd", "server"] }

[dev-dependencies]
assert_cmd = "2"
driftless-io = { path = "../driftless-io", features = ["test-util"] }
predicates = "3"
