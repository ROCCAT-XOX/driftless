[package]
name = "driftless-cli"
description = "Driftless: Kommandozeile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "driftless"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
driftless-io = { path = "../driftless-io" }
driftless-odom = { path = "../driftless-odom" }
driftless-slam = { path = "../driftless-slam" }
driftless-traj = { path = "../driftless-traj" }
las = "0.11"
png = "0.18"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rerun = { version = "0.38.1", default-features = false, features = ["sdk", "rrd", "server"] }

[dev-dependencies]
assert_cmd = "2"
driftless-io = { path = "../driftless-io", features = ["test-util"] }
jpeg-encoder = "0.7.1"
predicates = "3"
