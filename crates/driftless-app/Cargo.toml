[package]
name = "driftless-app"
description = "Driftless: die Oberfläche (Projekte, Läufe, Karten, 3D-Ansicht)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "driftless-app"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
# Times of the history in local time.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Reading point clouds and meshes in open formats (LAS, LAZ, E57, PLY, PCD, glb, OBJ).
driftless-export = { path = "../driftless-export" }
driftless-io = { path = "../driftless-io" }
# „Grafikkarte nutzen“ (`GpuPref`) in ⚙.
driftless-gpu = { path = "../driftless-gpu" }
# The settings of the surface (`SurfaceConfig`).
driftless-map = { path = "../driftless-map" }
driftless-slam = { path = "../driftless-slam" }
driftless-steps = { path = "../driftless-steps" }
driftless-traj = { path = "../driftless-traj" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
# wgpu only through `egui_wgpu::wgpu`, so that both always agree.
egui-wgpu = "0.36"
# Icon font (Phosphor, MIT) for the rail and the toolbars.
egui-phosphor = "0.14"
# Decoding the JPEG and PNG pages of a surface.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mimalloc = { version = "0.1", default-features = false }
# Writing the program symbol (`icon`) as PNG, also inside the .ico and .icns.
png = "0.18"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
pollster = "0.4"
rfd = "0.17"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
driftless-io = { path = "../driftless-io", features = ["test-util"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
# Foreign LAS files in the tests.
las = "0.11"
