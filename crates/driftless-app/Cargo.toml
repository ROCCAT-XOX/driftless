[package]
name = "driftless-app"
description = "Driftless: die Oberfläche (Projekte, Läufe, Karten, 3D-Ansicht)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
driftless-io = { path = "../driftless-io" }
driftless-steps = { path = "../driftless-steps" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
driftless-io = { path = "../driftless-io", features = ["test-util"] }
