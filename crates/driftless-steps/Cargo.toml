[package]
name = "driftless-steps"
description = "Driftless: die Schritte (prüfen, SLAM, Korrekturen, Karte, Vergleich) für Kommandozeile und Oberfläche"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
driftless-io = { path = "../driftless-io" }
driftless-map = { path = "../driftless-map" }
driftless-odom = { path = "../driftless-odom" }
driftless-slam = { path = "../driftless-slam" }
driftless-traj = { path = "../driftless-traj" }
las = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Peak memory for `map.json`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
driftless-io = { path = "../driftless-io", features = ["test-util"] }
