[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[licenses]
# MPL-2.0 only for dependencies we use unmodified (no code taken over).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Both come in through the debug viewer `rerun`:
    "BSL-1.0",              # xxhash-rust via re_log_encoding
    "CDLA-Permissive-2.0",  # webpki-roots (CA data) via ureq/ehttp
]
confidence-threshold = 0.9
