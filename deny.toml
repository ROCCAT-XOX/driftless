[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[licenses]
# MPL-2.0 only for dependencies we use unmodified (no code taken over).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Both come in through the debug viewer `rerun`:
    "BSL-1.0",              # xxhash-rust via re_log_encoding
    "CDLA-Permissive-2.0",  # webpki-roots (CA data) via ureq/ehttp
]
confidence-threshold = 0.9

[advisories]
# `paste` (proc-macro, unmaintained, no vulnerability) is pulled in by the debug viewer `rerun`
# (re_query, re_string_interner, ...). Nothing for us to upgrade; revisit on the next rerun update.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time macro only, transitive via rerun" },
]
